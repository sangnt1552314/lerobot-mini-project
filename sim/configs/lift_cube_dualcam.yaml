# LeIsaac-SO101-LiftCube-DualCam-v0 -- every tunable for the sim pipeline.
#
# Loaded by sim/leisaac_ext/config.py. Override the path with SIM_CONFIG=/path/to.yaml.
# Units: metres, degrees, seconds. "world" = Isaac Sim world frame (Z up).
#
# Scene facts (read from LeIsaac's table_with_cube/scene.usd, v0.1.2 assets):
#   table top        z = 0.041
#   cube             3 cm, 10 g, centre spawns at (0.346, -0.362, 0.0615)
#   robot base       (0.35, -0.64, 0.01), yawed 180 deg -> cube is ~28 cm in front of it

task:
  description: "Lift the red cube."
  # Success = cube centre this far above the robot base (upstream LiftCube uses 0.20).
  success_height_above_base: 0.20
  episode_length_s: 20.0

sim:
  physics_dt: 0.016666667   # 60 Hz physics
  decimation: 2             # -> 30 Hz control/env step == dataset fps == camera rate

robot:
  base_pos: [0.35, -0.64, 0.01]          # upstream LiftCube value
  init_joint_pos_deg:                    # upstream LiftCube starts at all zeros
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 0.0
  # The upstream state-machine device turns robot gravity off and raises joint damping
  # to 10 at runtime. We bake the same choices into the env so that data generation and
  # ACT evaluation run with identical dynamics.
  disable_gravity: true
  arm:     {stiffness: 17.8, damping: 10.0, effort_limit: 10.0}
  gripper: {stiffness: 17.8, damping: 2.0,  effort_limit: 2.0}   # ~STS3215 stall torque
  # Upstream rescales the gripper effort to (nearest object mass / 0.15) every step in
  # teleop/eval but not in state-machine datagen. Off here so both stages match.
  dynamic_gripper_effort_limit: false

# Camera poses are relative to their parent prim. Change ONLY here to match real cameras.
# rot is a quaternion (w, x, y, z) in the given convention ("ros" or "opengl").
cameras:
  front:
    parent: base                         # attached to Robot/base -> fixed in the world
    pos: [-0.6, -0.75, 0.38]             # upstream LiftCube front camera
    rot: [0.77337, 0.55078, -0.2374, -0.20537]
    convention: opengl
    focal_length: 40.6
    horizontal_aperture: 38.11
    width: 640
    height: 480
    fps: 30
  wrist:
    parent: gripper                      # moves with the gripper
    pos: [-0.001, 0.1, -0.04]            # upstream SingleArm template wrist camera
    rot: [-0.404379, -0.912179, -0.0451242, 0.0486914]
    convention: ros
    focal_length: 36.5
    horizontal_aperture: 36.83
    width: 640
    height: 480
    fps: 30

# Applied on every reset. Keep small for the first ACT baseline (sim-to-real later).
randomization:
  cube:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    yaw_deg: [-15.0, 15.0]
  front_camera:                          # tiny jitter, same magnitude as upstream LiftCube
    xyz: [-0.005, 0.005]
    rpy_deg: [-0.05, 0.05]

# Scripted expert (sim/leisaac_ext/lift_cube_dualcam/state_machine.py).
# It drives the IK target of the `gripper` body. Offsets are in the world frame and
# reuse the values LeIsaac's PickOrange state machine uses for the same SO-101 asset.
expert:
  grasp_offset: [-0.03, -0.01, 0.10]    # gripper-body target relative to the cube centre
  hover_height: 0.10                    # extra height above the grasp pose before descending
  lift_cube_height_above_base: 0.26     # cube centre target after lifting (> success height)
  lift_retract: 0.12                    # pull the cube this far back toward the base while lifting
  gripper_open_deg: 57.0                # = 1.0 rad, upstream state-machine "open"
  gripper_close_deg: 0.0                # closes onto the 3 cm cube; effort limit caps the squeeze
  ik_lambda: 0.04                       # DLS damping, upstream state-machine value
  # "pose" = position + orientation (PickOrange's choice). The arm has 5 joints, so a full
  # pose is a least-squares compromise; if the gripper approaches at a bad angle or falls
  # short, try another target_rpy_deg or "position" (orientation left free).
  ik_command: pose
  target_rpy_deg: [0.0, 0.0, 0.0]       # world-frame gripper orientation; PickOrange uses identity
  phase_s:                              # duration of each phase
    approach: 2.0
    hover: 0.5
    descend: 1.5
    grasp: 1.2
    lift: 2.5
    hold: 1.5
  success_hold_s: 0.3                   # end the episode once success held this long
